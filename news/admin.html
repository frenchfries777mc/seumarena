<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>SeumArena 뉴스 작성</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Black+Han+Sans&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0c0e13; --panel:#14171f; --panel-2:#1b1f2a; --line:#262b38;
  --accent-2:#3fe0c5; --text:#e8eaf0; --text-dim:#8890a4; --gold:#d9b95f; --sel:#ffd34d; --blue:#4d9dff; --red:#ff5d5d;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.5 'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
body{padding:0 max(14px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 90px) max(14px,env(safe-area-inset-left))}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 0 10px;background:linear-gradient(var(--bg) 80%,transparent)}
.top h1{margin:0;flex:1;font:400 22px 'Black Han Sans',sans-serif;letter-spacing:.04em}
.top h1 b{color:#ff4d4d;font-weight:400}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--text-dim);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--text-dim)}
.chip.ok{color:#bff5e9;border-color:#2b6b5f} .chip.ok i{background:var(--accent-2)}
.chip.bad{color:#ffc2c2;border-color:#6b2b2b} .chip.bad i{background:var(--red)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;max-width:1240px;margin:0 auto}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.box h2{margin:0 0 10px;font:700 15px 'IBM Plex Sans KR',sans-serif;color:var(--text-dim);letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.box h2 .sp{flex:1}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);border-left:4px solid var(--c);cursor:pointer;text-align:left;width:100%}
.row.on{outline:2px solid var(--sel);outline-offset:-1px}
.row .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.row .d{color:var(--text-dim);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .f{display:flex;gap:4px}
.flag{font-size:11px;font-weight:700;padding:0 6px;border-radius:999px;border:1px solid var(--line);color:var(--text-dim)}
.flag.off{opacity:.55;text-decoration:line-through}
.tagDot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.empty{color:var(--text-dim);text-align:center;padding:18px 0}
.btn{min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);font-weight:700;cursor:pointer}
.btn:hover{background:var(--line)}
.btn.pri{border:0;color:#fff;background:linear-gradient(105deg,var(--blue),#8a5cf0 52%,var(--red))}
.btn.pri:disabled{filter:grayscale(.8) brightness(.7);cursor:default}
.btn.warn{color:#ffb4b4;border-color:#5a2a2a}
.btn.sm{min-height:34px;padding:0 12px;font-size:13.5px}
form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px;margin-top:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--text-dim)}
label.w{grid-column:1/-1}
input[type=text],input[type=url],input[type=date],input[type=datetime-local],input[type=password],select,textarea{width:100%;min-height:42px;padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:#0f1218;color:var(--text);font-size:15px;font-weight:400}
textarea{min-height:120px;resize:vertical;line-height:1.6}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent-2)}
.checks{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 18px}
.checks label{flex-direction:row;align-items:center;gap:8px;color:var(--text);font-size:14.5px;cursor:pointer}
.checks input{width:20px;height:20px;accent-color:var(--accent-2)}
.imgRow{display:flex;gap:8px}
.imgRow input{flex:1;min-width:0}
.acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.err{grid-column:1/-1;color:#ffb4b4;font-size:13.5px;min-height:0}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:center;gap:10px;padding:10px max(14px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 10px) max(14px,env(safe-area-inset-left));background:rgba(12,14,19,.94);border-top:1px solid var(--line);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.bar .st{flex:1;min-width:0;font-size:13.5px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .st b{color:var(--sel)}
.pvTools{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text-dim)}
.pvTools label{flex-direction:row;align-items:center;gap:6px;color:var(--text-dim);cursor:pointer}
.stage{position:relative;border-radius:12px;overflow:hidden;background:radial-gradient(ellipse at 30% 20%,#232a3a,#0b0d12 70%);padding:18px 12px;min-height:280px;display:flex;align-items:flex-start;justify-content:center}
.dlg{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(6,8,12,.72);padding:16px}
.dlg .box{width:min(520px,100%);max-height:100%;overflow:auto}
.dlg p{margin:0 0 10px;color:#cdd2dc;font-size:14px}
.dlg ol{margin:0 0 12px;padding-left:20px;color:#cdd2dc;font-size:14px}
.dlg a{color:var(--accent-2)}
.dlg .acts{margin-top:12px}
pre.json{max-height:50vh;overflow:auto;background:#0f1218;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:12px;white-space:pre-wrap;word-break:break-all}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 78px);transform:translateX(-50%);z-index:30;padding:10px 18px;border-radius:999px;background:#202636;border:1px solid var(--line);font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:calc(100% - 28px)}

/* ===== the same look as the game's news window (copied from arena-src/news.js NEWS_CSS) ===== */
.nwCard{width:min(680px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-top:3px solid #e0a53c;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.55);overflow:hidden}
.nwHead{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#221c10,var(--panel))}
.nwHead svg{width:28px;height:28px;flex:none;color:#ffcf6a}
.nwHead h2{flex:1;margin:0;font:400 25px 'Black Han Sans','IBM Plex Sans KR',sans-serif;letter-spacing:.05em;color:#ffe3a0;text-shadow:0 2px 0 rgba(0,0,0,.45);transform:skewX(-8deg)}
.nwX{flex:none;width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font-size:24px;line-height:1;display:grid;place-items:center}
.nwList{padding:14px;display:flex;flex-direction:column;gap:12px}
.nwItem{flex:none;background:var(--panel-2);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;overflow:hidden}
.nwItem img{display:block;width:100%;height:auto;max-height:260px;object-fit:cover;background:#0b0d12}
.nwBody{padding:12px 16px 14px}
.nwMeta{display:flex;align-items:center;gap:8px;font:600 13px 'IBM Plex Sans KR',sans-serif;color:var(--text-dim);font-variant-numeric:tabular-nums}
.nwTag{color:#0c0e13;background:var(--c);border-radius:999px;padding:1px 10px;font-weight:800;font-size:12.5px;line-height:1.6}
.nwPin{width:15px;height:15px;color:var(--c)}
.nwNew{width:10px;height:10px;border-radius:50%;background:var(--red);margin-left:auto;box-shadow:0 0 0 3px rgba(255,93,93,.18)}
.nwItem h3{margin:7px 0 4px;font:700 19px/1.4 'IBM Plex Sans KR',sans-serif;color:var(--text);word-break:keep-all;overflow-wrap:anywhere}
.nwItem p{margin:0;font:400 15px/1.65 'IBM Plex Sans KR',sans-serif;color:#cdd2dc;white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere}
.nwLink{display:inline-block;margin-top:12px;padding:9px 28px;font-size:16px;text-decoration:none;color:#fff;font-family:'Black Han Sans','IBM Plex Sans KR',sans-serif;letter-spacing:.05em;background:linear-gradient(105deg,var(--blue),#8a5cf0 52%,var(--red));clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);text-shadow:0 2px 0 rgba(0,0,0,.3)}
.nwItem.out{opacity:.45}
.nwOut{font-size:11.5px;font-weight:700;color:var(--sel);border:1px solid #6b5a1e;border-radius:999px;padding:0 7px}
.who{display:flex;align-items:center;gap:8px}
.gate{max-width:1240px;margin:0 auto 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:12px;border:1px solid #6b5a1e;background:#1d1a10;color:#ffe3a0;font-weight:600}
.gate span{flex:1;min-width:200px}
body.ro #addBtn,body.ro #upBtn,body.ro #delBtn,body.ro #dupBtn,body.ro #pubBtn{display:none}
body.ro form input,body.ro form select,body.ro form textarea{pointer-events:none;opacity:.7}
</style>
<script src="https://frenchfries777.com/games/ff-auth.js"></script>
</head>
<body class="ro">
<header class="top">
  <h1>Seum<b>Arena</b> 뉴스</h1>
  <span class="who"><button class="chip" id="whoChip" type="button"><i></i><span>확인 중…</span></button></span>
</header>
<div class="gate" id="gate" hidden><span id="gateText"></span><button class="btn pri sm" id="loginBtn" type="button">로그인</button></div>

<main class="wrap">
  <section>
    <div class="box">
      <h2><span>뉴스 목록</span><span class="sp"></span><button class="btn sm" id="reloadBtn" type="button">다시 불러오기</button><button class="btn sm pri" id="addBtn" type="button">+ 새 뉴스</button></h2>
      <div class="list" id="list"></div>
    </div>
    <div class="box" id="editBox" style="margin-top:16px" hidden>
      <h2><span id="editTitle">뉴스 편집</span></h2>
      <form id="form" autocomplete="off" onsubmit="return false">
        <label>분류<select name="kind"><option>공지</option><option>업데이트</option><option>이벤트</option><option>점검</option></select></label>
        <label>날짜<input type="date" name="date" required></label>
        <label class="w">제목<input type="text" name="title" maxlength="120" required></label>
        <label class="w">본문<textarea name="body" maxlength="4000"></textarea></label>
        <label class="w">이미지 주소 (https)
          <span class="imgRow"><input type="url" name="image" placeholder="https://..."><button class="btn sm" id="upBtn" type="button">사진 올리기</button><input type="file" id="upFile" accept="image/*" hidden></span>
        </label>
        <label>버튼 글자<input type="text" name="link_label" maxlength="30" placeholder="자세히 보기"></label>
        <label>버튼 링크 (https)<input type="url" name="link_url" placeholder="https://..."></label>
        <label>공개 시작 (비우면 바로)<input type="datetime-local" name="start_at"></label>
        <label>공개 끝 (비우면 계속)<input type="datetime-local" name="end_at"></label>
        <div class="checks">
          <label><input type="checkbox" name="popup" checked>접속하면 팝업으로 띄우기</label>
          <label><input type="checkbox" name="pin">맨 위에 고정</label>
        </div>
        <div class="err" id="formErr"></div>
        <div class="acts"><button class="btn warn sm" id="delBtn" type="button">삭제</button><button class="btn sm" id="dupBtn" type="button">복제</button><button class="btn sm" id="doneBtn" type="button">편집 닫기</button></div>
      </form>
    </div>
  </section>
  <section>
    <div class="box">
      <h2><span>게임 화면 미리보기</span><span class="sp"></span><span class="pvTools"><label><input type="checkbox" id="pvAll">기간 밖 뉴스도 보기</label></span></h2>
      <div class="stage"><div class="nwCard"><div class="nwHead" id="pvHead"><h2>뉴스</h2><span class="nwX">&times;</span></div><div class="nwList" id="pvList"></div></div></div>
    </div>
  </section>
</main>

<div class="bar">
  <span class="st" id="status">불러오는 중…</span>
  <button class="btn pri" id="pubBtn" type="button" disabled>게시하기</button>
</div>

<div class="dlg" id="pubDlg" hidden>
  <div class="box">
    <h2>게시할까요?</h2>
    <p id="pubSum"></p>
    <div class="err" id="pubErr"></div>
    <div class="acts"><button class="btn sm" id="pubCancel" type="button">취소</button><button class="btn pri sm" id="pubGo" type="button">게시하기</button></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
(() => {
'use strict';
/* news rows live in the Supabase table seumarena_news. Everyone can read; only the lead developer (ff_devs role 'owner') can write.
   Signing in is the Frenchfries777 account (ff-auth.js). Pictures go to the public ff-images bucket, in the writer's own folder. */
const SB = 'https://kebsbuvuutilitwlvxzv.supabase.co', KEY = 'sb_publishable_4Egu0zm3p6cxWGvP_-GlIw_mlCpO1Nf', T = 'seumarena_news';
const COLS = ['id', 'kind', 'date', 'title', 'body', 'image', 'link_label', 'link_url', 'popup', 'pin', 'start_at', 'end_at'];
const KIND = { '공지': '#4d9dff', '업데이트': '#3fe0c5', '이벤트': '#ffd34d', '점검': '#ff5d5d' };
const DRAFT_KEY = 'seumNewsAdminDraft2';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const okUrl = u => { u = String(u || '').trim(); return /^https:\/\//i.test(u) ? u : ''; };
const ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 5.5h13v13a2 2 0 0 0 2 2h-13a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M16.5 9h4v9.5a2 2 0 0 1-4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M6.5 9h7v4h-7z" fill="currentColor"/><path d="M6.5 15.5h7M6.5 18h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
$('pvHead').insertAdjacentHTML('afterbegin', ICON);

let sb = null, me = null, owner = false, base = '[]', news = [], sel = null, loaded = false;
function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => el.hidden = true, 2600); }
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const toIso = v => { if (!v) return null; const d = new Date(v); return isNaN(d) ? null : d.toISOString(); };
function toLocalInput(iso) { if (!iso) return ''; const d = new Date(iso); if (isNaN(d)) return ''; const p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()); }
const clean = r => { const o = {}; for (const k of COLS) o[k] = r[k] === undefined || r[k] === '' ? null : r[k]; o.popup = r.popup !== false; o.pin = !!r.pin; return o; };
const sameTime = (a, b) => (a ? Date.parse(a) : 0) === (b ? Date.parse(b) : 0);
const rowKey = r => JSON.stringify(Object.assign(clean(r), { start_at: r.start_at ? Date.parse(r.start_at) : null, end_at: r.end_at ? Date.parse(r.end_at) : null }));

/* ---- account ---- */
function setWho() {
  const ch = $('whoChip'), g = $('gate');
  ch.className = 'chip ' + (owner ? 'ok' : me ? 'bad' : '');
  ch.querySelector('span').textContent = owner ? '총괄 개발자' : me ? '읽기 전용' : '로그인 안 됨';
  document.body.classList.toggle('ro', !owner);
  g.hidden = owner;
  $('gateText').textContent = !window.FFAuth ? '로그인 도구를 불러오지 못했어요. 읽기만 할 수 있어요.' : me ? '총괄 개발자 계정만 뉴스를 쓸 수 있어요. 지금은 읽기만 돼요.' : '뉴스를 쓰려면 총괄 개발자 계정으로 로그인해 주세요.';
  $('loginBtn').hidden = !window.FFAuth || !!me;
}
async function account() {
  const A = window.FFAuth;
  if (!A) { me = null; owner = false; setWho(); return; }
  try { await A.ready; } catch (e) {}
  sb = A.client && A.client(); me = A.user && A.user(); owner = false;
  if (me && sb) { try { const r = await sb.from('ff_devs').select('role').eq('user_id', me.id).maybeSingle(); owner = !!(r.data && r.data.role === 'owner'); } catch (e) {} }
  setWho(); paintAll();
}
$('loginBtn').onclick = () => { try { window.FFAuth.openLogin(); } catch (e) { toast('로그인 창을 열지 못했어요'); } };
$('whoChip').onclick = () => { if (!me && window.FFAuth) $('loginBtn').click(); else if (window.FFAuth && FFAuth.openProfile) FFAuth.openProfile(); };

/* ---- load ---- */
async function fetchRows() {
  if (sb) { const r = await sb.from(T).select(COLS.join(',') + ',created_at').order('pin', { ascending: false }).order('date', { ascending: false }).order('created_at', { ascending: false }); if (r.error) throw r.error; return r.data; }
  const r = await fetch(SB + '/rest/v1/' + T + '?select=' + COLS.join(',') + ',created_at&order=pin.desc,date.desc,created_at.desc', { headers: { apikey: KEY }, cache: 'no-store' });
  if (!r.ok) throw new Error('불러오기 실패 ' + r.status); return r.json();
}
async function load() {
  $('status').textContent = '불러오는 중…'; loaded = false; paintBar();
  try { news = (await fetchRows()).map(clean); }
  catch (e) { $('status').textContent = '불러오지 못했어요 (' + (e.message || e) + ')'; return; }
  base = JSON.stringify(news.map(rowKey)); loaded = true;
  const dr = draft(); if (dr && dr.base === base && Array.isArray(dr.news) && JSON.stringify(dr.news.map(rowKey)) !== base) { news = dr.news.map(clean); toast('게시 안 한 편집을 이어서 열었어요'); }
  sel = null; $('editBox').hidden = true; paintAll();
}
function draft(v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); if (v === null) localStorage.removeItem(DRAFT_KEY); else localStorage.setItem(DRAFT_KEY, JSON.stringify(v)); } catch (e) {} return null; }
function changes() {
  const old = JSON.parse(base).map(s => JSON.parse(s)), om = new Map(old.map(r => [r.id, JSON.stringify(r)])), nm = new Map(news.map(r => [r.id, rowKey(r)]));
  const add = [], mod = [], del = [];
  for (const [id, s] of nm) { if (!om.has(id)) add.push(id); else if (om.get(id) !== s) mod.push(id); }
  for (const id of om.keys()) if (!nm.has(id)) del.push(id);
  return { add, mod, del };
}
const dirty = () => { if (!loaded) return false; const c = changes(); return !!(c.add.length + c.mod.length + c.del.length); };
function paintBar() {
  if (!loaded) { $('pubBtn').disabled = true; return; }
  const c = changes(), n = c.add.length + c.mod.length + c.del.length;
  $('status').innerHTML = n ? '바뀐 뉴스 <b>' + n + '건</b>' + (c.add.length ? ' · 추가 ' + c.add.length : '') + (c.mod.length ? ' · 수정 ' + c.mod.length : '') + (c.del.length ? ' · 삭제 ' + c.del.length : '') : '게시된 상태와 같아요 · 뉴스 ' + news.length + '개';
  $('pubBtn').disabled = !n || !owner;
  draft(n ? { base, news } : null);
}
/* ---- list + preview ---- */
const live = (n, now) => !(n.start_at && Date.parse(n.start_at) > now) && !(n.end_at && Date.parse(n.end_at) <= now);
const sorted = l => l.slice().sort((a, b) => (!!b.pin - !!a.pin) || String(b.date || '').localeCompare(String(a.date || '')));
function paintList() {
  const now = Date.now(), l = sorted(news);
  $('list').innerHTML = l.length ? l.map(n => '<button type="button" class="row' + (n.id === sel ? ' on' : '') + '" data-id="' + esc(n.id) + '" style="--c:' + (KIND[n.kind] || '#d9b95f') + '"><span class="tagDot"></span><span class="t">' + esc(n.title || '(제목 없음)') + '</span><span class="f">' +
    (n.pin ? '<span class="flag">고정</span>' : '') + (n.popup === false ? '<span class="flag off">팝업</span>' : '') + (!live(n, now) ? '<span class="flag">' + (n.start_at && Date.parse(n.start_at) > now ? '예약' : '끝남') + '</span>' : '') + '<span class="d">' + esc(n.date || '') + '</span></span></button>').join('') : '<div class="empty">' + (loaded ? '아직 뉴스가 없어요' : '…') + '</div>';
  for (const b of $('list').querySelectorAll('.row')) b.onclick = () => edit(b.dataset.id);
}
function itemHtml(n, out) {
  const c = KIND[n.kind] || 'var(--gold)', img = okUrl(n.image), lk = okUrl(n.link_url);
  return '<article class="nwItem' + (out ? ' out' : '') + '" style="--c:' + c + '">' + (img ? '<img src="' + esc(img) + '" alt="" onerror="this.remove()">' : '') +
    '<div class="nwBody"><div class="nwMeta">' + (n.kind ? '<span class="nwTag">' + esc(n.kind) + '</span>' : '') + (n.pin ? '<svg class="nwPin" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l-1 6 4 4H6l4-4z M12 13v8" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>' : '') +
    '<span>' + esc(String(n.date || '').replace(/-/g, '.')) + '</span>' + (out ? '<span class="nwOut">' + (n.start_at && Date.parse(n.start_at) > Date.now() ? '예약' : '끝남') + '</span>' : '') + '</div>' +
    '<h3>' + esc(n.title || '') + '</h3>' + (n.body ? '<p>' + esc(n.body) + '</p>' : '') + (lk ? '<a class="nwLink" href="' + esc(lk) + '" target="_blank" rel="noopener">' + esc(n.link_label || '자세히 보기') + '</a>' : '') + '</div></article>';
}
function paintPreview() {
  const now = Date.now(), all = $('pvAll').checked, l = sorted(news).filter(n => all || live(n, now));
  $('pvList').innerHTML = l.length ? l.map(n => itemHtml(n, !live(n, now))).join('') : '<div class="empty">보여 줄 뉴스가 없어요 (게임에서는 신문 버튼이 숨겨져요)</div>';
}
function paintAll() { paintList(); paintPreview(); paintBar(); }
$('pvAll').onchange = paintPreview;
/* ---- edit ---- */
const F = $('form');
function edit(id) {
  sel = id; const n = news.find(x => x.id === id); if (!n) { sel = null; $('editBox').hidden = true; paintAll(); return; }
  $('editBox').hidden = false; $('editTitle').textContent = owner ? '뉴스 편집' : '뉴스 보기';
  F.kind.value = KIND[n.kind] ? n.kind : '공지'; F.date.value = n.date || ''; F.title.value = n.title || ''; F.body.value = n.body || ''; F.image.value = n.image || '';
  F.link_label.value = n.link_label || ''; F.link_url.value = n.link_url || ''; F.start_at.value = toLocalInput(n.start_at); F.end_at.value = toLocalInput(n.end_at);
  F.popup.checked = n.popup !== false; F.pin.checked = !!n.pin; check(n); paintAll();
  if (innerWidth <= 900) $('editBox').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function check(n) {
  const e = [];
  if (!n.title) e.push('제목을 넣어 주세요');
  if (!/^\d{4}-\d\d-\d\d$/.test(n.date || '')) e.push('날짜를 넣어 주세요');
  if (F.image.value.trim() && !okUrl(F.image.value)) e.push('이미지 주소는 https로 시작해야 해요');
  if (F.link_url.value.trim() && !okUrl(F.link_url.value)) e.push('버튼 링크는 https로 시작해야 해요');
  if (n.start_at && n.end_at && Date.parse(n.end_at) <= Date.parse(n.start_at)) e.push('공개 끝이 시작보다 늦어야 해요');
  $('formErr').textContent = e.join(' · '); return !e.length;
}
function fromForm() {
  if (!owner) return; const i = news.findIndex(x => x.id === sel); if (i < 0) return;
  const old = news[i], s = toIso(F.start_at.value), e = toIso(F.end_at.value);
  const n = clean({ id: sel, kind: F.kind.value, date: F.date.value, title: F.title.value.trim(), body: F.body.value.replace(/\s+$/, ''),
    image: okUrl(F.image.value), link_url: okUrl(F.link_url.value), link_label: okUrl(F.link_url.value) ? (F.link_label.value.trim() || '자세히 보기') : null,
    start_at: s && sameTime(s, old.start_at) ? old.start_at : s, end_at: e && sameTime(e, old.end_at) ? old.end_at : e, popup: F.popup.checked, pin: F.pin.checked });
  news[i] = n; check(n); paintAll();
}
F.addEventListener('input', fromForm); F.addEventListener('change', fromForm);
const newId = () => 'n-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
$('addBtn').onclick = () => { if (!loaded || !owner) return; const id = newId(); news.unshift(clean({ id, kind: '공지', date: today(), title: '' })); edit(id); $('editTitle').textContent = '새 뉴스'; F.title.focus(); };
$('dupBtn').onclick = () => { const n = news.find(x => x.id === sel); if (!n || !owner) return; const id = newId(); news.unshift(clean(Object.assign({}, n, { id, date: today() }))); edit(id); toast('복제했어요'); };
$('delBtn').onclick = () => { const n = news.find(x => x.id === sel); if (!n || !confirm('"' + (n.title || '제목 없음') + '" 뉴스를 지울까요? (게시하기 전까지는 다시 불러오기로 되돌릴 수 있어요)')) return; news = news.filter(x => x.id !== sel); sel = null; $('editBox').hidden = true; paintAll(); };
$('doneBtn').onclick = () => { sel = null; $('editBox').hidden = true; paintAll(); };
$('reloadBtn').onclick = () => { if (dirty() && !confirm('게시하지 않은 편집이 사라져요. 다시 불러올까요?')) return; draft(null); load(); };
/* ---- pictures: shrunk to at most 1280 px wide (JPEG), then put in ff-images/<my id>/seumarena-news/ ---- */
$('upBtn').onclick = () => { if (owner && sel) $('upFile').click(); };
$('upFile').onchange = async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f || !sel || !owner) return;
  try {
    toast('사진 줄이는 중…');
    const im = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = URL.createObjectURL(f); });
    const k = Math.min(1, 1280 / im.naturalWidth), cv = document.createElement('canvas'); cv.width = Math.round(im.naturalWidth * k); cv.height = Math.round(im.naturalHeight * k);
    const g = cv.getContext('2d'); g.fillStyle = '#0c0e13'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(im, 0, 0, cv.width, cv.height);
    const blob = await new Promise(ok => cv.toBlob(ok, 'image/jpeg', .86));
    const path = me.id + '/seumarena-news/' + new Date().toISOString().replace(/[-:T.Z]/g, '').slice(0, 14) + '-' + Math.random().toString(36).slice(2, 6) + '.jpg';
    toast('사진 올리는 중…');
    const r = await sb.storage.from('ff-images').upload(path, blob, { contentType: 'image/jpeg', upsert: false });
    if (r.error) throw r.error;
    F.image.value = sb.storage.from('ff-images').getPublicUrl(path).data.publicUrl; fromForm(); toast('사진을 올렸어요');
  } catch (err) { toast('사진을 올리지 못했어요 (' + (err.message || err) + ')'); }
};
/* ---- publish: upsert what was added or changed, delete what was removed ---- */
$('pubBtn').onclick = () => {
  if (!owner) return;
  const bad = news.find(n => !n.title || !/^\d{4}-\d\d-\d\d$/.test(n.date || '')); if (bad) { edit(bad.id); toast('제목과 날짜가 빠진 뉴스가 있어요'); return; }
  const c = changes();
  $('pubSum').textContent = '추가 ' + c.add.length + ' · 수정 ' + c.mod.length + ' · 삭제 ' + c.del.length + '. 게시하면 다음에 게임을 켜는 사람부터 보여요.';
  $('pubErr').textContent = ''; $('pubDlg').hidden = false;
};
$('pubCancel').onclick = () => $('pubDlg').hidden = true;
$('pubGo').onclick = async () => {
  const go = $('pubGo'); go.disabled = true; $('pubErr').textContent = '';
  try {
    const now = JSON.stringify((await fetchRows()).map(clean).map(rowKey));
    if (now !== base) throw new Error('그사이 다른 곳에서 바뀌었어요. 다시 불러온 뒤 게시해 주세요');
    const c = changes(), up = news.filter(n => c.add.includes(n.id) || c.mod.includes(n.id)).map(clean);
    if (up.length) { const r = await sb.from(T).upsert(up, { onConflict: 'id' }); if (r.error) throw r.error; }
    if (c.del.length) { const r = await sb.from(T).delete().in('id', c.del); if (r.error) throw r.error; }
    draft(null); $('pubDlg').hidden = true; toast('게시했어요!'); await load();
  } catch (e) { $('pubErr').textContent = /row-level security|permission/i.test(e.message || '') ? '총괄 개발자 계정만 게시할 수 있어요' : (e.message || String(e)); }
  go.disabled = false;
};
for (const d of document.querySelectorAll('.dlg')) d.addEventListener('click', e => { if (e.target === d) d.hidden = true; });
addEventListener('beforeunload', e => { if (dirty()) { e.preventDefault(); e.returnValue = ''; } });
(async () => {
  setWho(); paintAll();
  if (window.FFAuth) { try { FFAuth.onChange(async () => { const was = me && me.id; await account(); if ((me && me.id) !== was) load(); }); } catch (e) {} }
  await account(); await load();
})();
})();
</script>
</body>
</html>
