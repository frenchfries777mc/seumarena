<title>SeumArena</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Black+Han+Sans&display=swap">
<style>
[hidden]{display:none!important}      /* the chat bar, HUD and other hidden parts must stay hidden even when the file is opened on its own (no wrapper page) */
/* Layout: Stickseum lobby (brand top centre, picked character big on the left, gold menu buttons on the right) over a blurred live match; full-bleed canvas arena with an edge-pinned HUD. Single dark look, as in Stickseum. */
:root{
  color-scheme: dark;
  --bg:#0c0e13; --panel:#14171f; --panel-2:#1b1f2a; --line:#262b38;
  --accent:#ff4d4d; --accent-2:#3fe0c5; --text:#e8eaf0; --text-dim:#8890a4;
  --gold:#d9b95f; --gold-ink:#3b2410; --sel:#ffd34d;
  --blue:#4d9dff; --red:#ff5d5d;
  --font:'Rajdhani','IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--bg);transition:filter .4s}
#game.inLobby{filter:blur(1.5px) brightness(.5) saturate(1.1)}

/* ---------- lobby ---------- */
#lobby{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;overflow-y:auto;
  padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.card{position:relative;z-index:1;width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:26px 24px 22px;box-shadow:0 20px 60px rgba(0,0,0,.5);display:none;margin:auto}
.card.active{display:block}
.card h2{margin:0 0 6px;font-size:24px;font-weight:700;text-wrap:balance}
.hint{color:var(--text-dim);font-size:14px;line-height:1.5;margin:0 0 10px}
.backlink{position:absolute;top:14px;right:14px;background:none;border:0;color:var(--text-dim);font-weight:700;font-size:14px;cursor:pointer;padding:4px}
.backlink:hover{color:var(--text)}
.btn-primary{background:var(--accent-2);color:#062824;border:0;border-radius:8px;padding:12px 14px;font-weight:700;font-size:16px;cursor:pointer}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-plain{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font-weight:700;font-size:14px;cursor:pointer}
.btn-full{display:block;width:100%}
.brand{display:none;flex-direction:column;align-items:center;text-align:center;position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 3%);
  transform:translateX(-50%);width:94vw;max-width:960px;z-index:2;pointer-events:none}
.brand.show{display:flex}
.brand h1{font-size:clamp(40px,8vw,85px);font-weight:700;letter-spacing:.5px;margin:0;color:var(--text);line-height:1;white-space:nowrap;text-shadow:0 6px 18px rgba(0,0,0,.6)}
.brand span{color:var(--accent)}
.brand .ver{font-size:clamp(13px,2.2vw,22px);color:var(--text-dim);font-weight:700;margin-top:6px}
#lobbyChar{position:fixed;left:4vw;bottom:6vh;transition:none;z-index:2;display:none;flex-direction:column;align-items:center;pointer-events:none}
#lobbyChar.show{display:flex}
#lobbyChar canvas{width:min(360px,34vw,56vh);height:auto;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5))}
#lobbyCharName{margin-top:-30px;font-weight:700;font-size:22px;letter-spacing:.04em;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.7)}
#menuScreen.menu-floating{position:absolute;right:max(5vw, calc(env(safe-area-inset-right, 0px) + 24px));top:50%;transform:translateY(-50%);
  background:none;border:none;box-shadow:none;padding:0;width:min(300px,76vw);display:none;margin:0}
#menuScreen.menu-floating.active{display:block}
@media (max-width:640px){#menuScreen.menu-floating{right:auto;left:50%;top:57%;transform:translate(-50%,-50%)}}
@media (max-height:640px){.keys{display:none}}
.menu-float-btn{display:block;width:100%;cursor:pointer}
/*@@MENUCSS@@*/
#lobbyPick{margin:4px 0 10px;text-align:center;font-weight:700;font-size:15px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.8)}
#lobbyPick b{color:var(--sel)}
.keys{margin:0;font-size:13px;line-height:1.65;color:#c9ced8;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.9);font-family:'IBM Plex Sans KR',sans-serif}
.keys kbd{font:600 11px 'IBM Plex Sans KR',sans-serif;color:var(--text);background:rgba(20,23,31,.85);border:1px solid var(--line);border-radius:5px;padding:1px 5px}

/* character screen (Stickseum's weaponScreen) */
#weaponScreen{width:min(880px,100%)}
#weaponSearch{display:block;margin:4px auto 8px;width:min(260px,80%);padding:7px 12px;border-radius:10px;border:1px solid #3a4150;background:#171b24;color:#fff;font-size:14px;font-family:inherit;-webkit-user-select:text;user-select:text}
#weaponGrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;max-height:min(540px,calc(100vh - 250px));overflow-y:auto;overflow-x:hidden;padding:2px}
@media (max-width:760px){#weaponGrid{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}}
.wpnCard{position:relative;background:var(--panel-2);border:2px solid var(--line);border-radius:10px;padding:5px 3px 7px;text-align:center;cursor:pointer;color:var(--text);
  transition:border-color .12s ease;min-width:0}
.wpnCard:hover{border-color:var(--accent-2)}
.wpnCard.sel{border-color:var(--sel);box-shadow:0 0 10px rgba(255,211,77,.45)}
.wpnCard canvas{width:64px;height:64px;max-width:100%;display:block;margin:0 auto}
.wpnCard .wn{font-weight:700;font-size:13px;line-height:1.2;overflow-wrap:anywhere}
.wpnCard .wk{font-size:11px;color:var(--text-dim)}
.wpnCard .wm{margin:3px 4px 0;font-size:11px;line-height:1.2}
.wpnCard .wm b{display:block;color:var(--mc,#c8803a);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wpnCard .wmBar{display:block;height:5px;margin-top:3px;border-radius:999px;background:#0d0f14;border:1px solid var(--line);overflow:hidden}
.wpnCard .wmBar i{display:block;height:100%;background:var(--mc,#c8803a)}
@media (max-width:760px){.wpnCard .wm{font-size:10px;margin:3px 1px 0} .wpnCard .wm b{white-space:normal;overflow-wrap:anywhere;letter-spacing:-.03em}}
#weaponScreen.wDetail #weaponGrid,#weaponScreen.wDetail #weaponSearch{display:none}
#weaponScreen:not(.wDetail) #weaponPortraitWrap{display:none}
#weaponPortraitWrap{text-align:center;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:8px 18px;align-items:start}
@media (max-width:760px){#weaponPortraitWrap{grid-template-columns:minmax(0,1fr)}}
#weaponPortraitName{font-size:22px;font-weight:700;grid-column:1/-1}
#weaponPortraitCanvas{background:radial-gradient(circle at 50% 35%,#3a3354 0%,#1d1a2b 70%);border:1px solid #4a4266;border-radius:8px;display:block;margin:0 auto;width:200px;max-width:100%;height:auto}
#weaponDetail{text-align:left;font-size:14px;line-height:1.55;font-family:'IBM Plex Sans KR',sans-serif;min-width:0}
#weaponDetail p{margin:0 0 8px}
#weaponDetail strong{color:var(--sel);margin-right:6px}
#weaponActions{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}

/* map screen (Stickseum's mapCarousel) */
#mapScreen{width:min(520px,100%)}
#mapCarousel{display:flex;align-items:center;gap:8px;margin:10px 0}
#mapCarousel>button{flex:none;width:40px;height:64px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font-size:20px;cursor:pointer}
#mapCarouselBody{flex:1;min-width:0;text-align:center}
#mapCarouselPreview{width:100%;height:auto;border-radius:8px;display:block;background:#0d0f14;aspect-ratio:25/17}
#mapCarouselName{font-weight:700;font-size:20px;margin-top:8px}
#mapCarouselMeta{font-size:13px;color:var(--text-dim);line-height:1.5;font-family:'IBM Plex Sans KR',sans-serif}
#mapDots{display:flex;justify-content:center;gap:6px;margin:8px 0 12px}
#mapDots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
#mapDots i.on{background:var(--sel)}

/* matchmaking */
#roomScreen{text-align:center}
#roomStatus{font-family:'IBM Plex Sans KR',sans-serif;min-height:3em}
#roomCount{font-size:64px;font-weight:700;line-height:1;color:var(--sel);font-variant-numeric:tabular-nums;min-height:64px}
#roomSlots{display:flex;justify-content:center;gap:8px;margin:14px 0 18px;min-height:14px}
#roomSlots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--panel-2)}
#roomSlots i.on{background:var(--accent-2);border-color:var(--accent-2)}
/* account */
#acct{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 14px);left:max(16px, env(safe-area-inset-left, 0px));display:flex;align-items:center;gap:8px;
  background:rgba(20,22,28,.85);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 12px;font:600 14px 'IBM Plex Sans KR',sans-serif;max-width:calc(100vw - 32px)}
#acctIcon{color:var(--accent-2);font-size:10px}
@media (max-width:640px){.brand{top:calc(env(safe-area-inset-top,0px) + 60px)}}
#acctName{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
#acctBtn{border:0;border-radius:999px;padding:4px 12px;background:var(--accent-2);color:#062824;font:700 12px 'IBM Plex Sans KR',sans-serif;cursor:pointer}
#acctBtn:disabled{background:var(--panel-2);color:var(--text-dim);cursor:default}
/* cosmetics */
#cosScreen{width:min(760px,100%);max-height:calc(100vh - 32px);overflow-y:auto}
#cosTabs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
#cosTabs button{font:600 13px 'IBM Plex Sans KR',sans-serif;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);color:var(--text-dim);cursor:pointer}
#cosTabs button[aria-pressed="true"]{background:var(--accent-2);color:#062824;border-color:var(--accent-2)}
#cosGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.cosCard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:10px;border:2px solid var(--line);background:var(--panel-2);color:var(--text);cursor:pointer;font:600 12px 'IBM Plex Sans KR',sans-serif;min-width:0}
.cosCard span{overflow-wrap:anywhere;text-align:center;line-height:1.3}
.cosCard[aria-pressed="true"]{border-color:var(--sel);box-shadow:0 0 10px rgba(255,211,77,.4)}
.cosPv{width:72px;height:72px;display:flex;align-items:center;justify-content:center;font-size:36px}
.cosPv canvas{width:72px;height:72px}
/* chat & emotes */
.miniBtn{position:fixed;z-index:6;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(20,22,28,.85);font-size:19px;cursor:pointer;touch-action:none;
  right:max(16px, env(safe-area-inset-right, 0px))}
#emoteBtn{top:calc(env(safe-area-inset-top,0px) + 50px)}
#chatBtn{top:calc(env(safe-area-inset-top,0px) + 96px)}
#chatFeed{position:fixed;z-index:5;left:max(16px, env(safe-area-inset-left, 0px));bottom:calc(env(safe-area-inset-bottom,0px) + 70px);display:flex;flex-direction:column;gap:3px;
  pointer-events:none;font:500 13px 'IBM Plex Sans KR',sans-serif;max-width:min(380px,60vw)}
#chatFeed div{background:rgba(20,22,28,.78);padding:3px 9px;border-radius:8px;width:max-content;max-width:100%;overflow-wrap:anywhere}
#chatFeed .b{color:var(--blue)} #chatFeed .r{color:var(--red)}
#chatBar{position:fixed;z-index:8;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;gap:6px;width:min(480px,calc(100vw - 32px))}
#chatInput{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--accent-2);background:rgba(12,14,19,.95);color:#fff;font:500 15px 'IBM Plex Sans KR',sans-serif;-webkit-user-select:text;user-select:text}
#chatSend{border:0;border-radius:10px;padding:0 14px;background:var(--accent-2);color:#062824;font:700 14px 'IBM Plex Sans KR',sans-serif;cursor:pointer}
#emoteWheel{position:fixed;z-index:8;left:50%;top:50%;width:220px;height:220px;margin:-110px 0 0 -110px;border-radius:50%;background:rgba(12,14,19,.6)}
#emoteWheel button{position:absolute;width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--panel);font-size:24px;cursor:pointer}
#emoteWheel button:hover{border-color:var(--sel)}
#winCanvas{width:100%;max-width:520px;height:auto;display:block;margin:0 auto 6px}
/* the gambler's card banner (from Stickseum) */
#diceBannerContainer{position:fixed;z-index:7;left:50%;top:calc(env(safe-area-inset-top,0px) + 80px);transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;font-family:'Rajdhani','IBM Plex Sans KR',sans-serif}
.diceBanner{ background:rgba(15,17,23,.92); border:2px solid #ffd34d; border-radius:12px; padding:8px 16px 10px; text-align:center; min-width:120px; box-shadow:0 6px 18px rgba(0,0,0,.4); opacity:0; transform:translateY(-8px); transition:opacity .18s ease, transform .18s ease; }
.diceBanner.show{ opacity:1; transform:translateY(0); }
.diceBanner .dbName{ font-size:12px; font-weight:700; color:var(--text-dim); margin-bottom:2px; font-family:'IBM Plex Sans KR',sans-serif }
.diceBanner .dbEffect{ font-size:13px; font-weight:700; color:#ffd34d; margin-top:4px; min-height:14px; font-family:'IBM Plex Sans KR',sans-serif }
.pkRow{ display:flex; gap:10px; justify-content:center; perspective:600px; }
.diceBanner.pkBanner{ background:transparent; border:none; box-shadow:none; padding:0; }
.diceBanner.pkBanner .dbName, .diceBanner.pkBanner .dbEffect{ text-shadow:0 2px 6px #000; }
.diceBanner.pkBanner .dbEffect{ font-size:15px; margin-top:8px; }
.pkCard{ width:64px; height:92px; border-radius:10px; border:3px solid #fff; box-shadow:0 6px 16px rgba(0,0,0,.55); display:flex; flex-direction:column; align-items:center; justify-content:center; font:700 32px/1 'Rajdhani',sans-serif; background:#fff; color:#15171d; }
.pkCard.back{ background:repeating-linear-gradient(45deg,#e0283c 0 8px,#a01626 8px 16px); color:transparent; animation:pkSpin .55s linear infinite; }
.pkCard.red{ color:#d62839; }
.pkCard.flip{ animation:pkFlip .28s ease-out; }
.pkCard small{ font-size:28px; margin-top:4px; }
.pkCard .jk{ font-size:13px; font-weight:700; margin-top:3px; }
@keyframes pkSpin{ to{ transform:rotateY(360deg); } }
@keyframes pkFlip{ from{ transform:rotateY(90deg) scale(1.15); } to{ transform:rotateY(0) scale(1); } }
@media (prefers-reduced-motion: reduce){ .pkCard.back{ animation:none } .pkCard.flip{ animation:none } }
/* result */
#overScreen{text-align:center}
#resultText{font-size:clamp(48px,14vw,80px);font-weight:700;line-height:1;margin:0 0 6px;letter-spacing:.04em}
#resultText.win{color:var(--sel)} #resultText.lose{color:var(--accent)} #resultText.draw{color:var(--text)}
.final{display:flex;justify-content:center;gap:14px;align-items:center;font-size:40px;font-weight:700;font-variant-numeric:tabular-nums}
.final .b{color:var(--blue)} .final .r{color:var(--red)}
#mine{margin:6px 0 16px;color:var(--text-dim);font-size:15px}
#overScreen .btn-primary{margin-bottom:8px}

/* ---------- HUD ---------- */
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:center;pointer-events:none;z-index:5;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.scorebar{display:flex;align-items:center;gap:10px;font-weight:700;font-variant-numeric:tabular-nums}
.score{min-width:60px;padding:5px 12px;border-radius:10px;font-size:26px;line-height:1;text-align:center;color:#06101f}
.score small{display:block;font-size:11px;letter-spacing:.08em;opacity:.8;margin-bottom:2px}
.score.b{background:var(--blue)} .score.r{background:var(--red)}
.timer{font-size:22px;padding:6px 12px;border-radius:10px;background:rgba(20,22,28,.85);border:1px solid var(--line);min-width:66px;text-align:center}
.timer.hot{color:var(--accent);border-color:var(--accent)}
#feed{position:fixed;z-index:5;left:max(16px, env(safe-area-inset-left, 0px));top:calc(env(safe-area-inset-top,0px) + 72px);
  display:flex;flex-direction:column;gap:4px;pointer-events:none;font-size:13px;font-weight:600;font-family:'IBM Plex Sans KR',sans-serif}
#feed div{background:rgba(20,22,28,.8);padding:3px 9px;border-radius:8px;width:max-content;max-width:70vw}
#feed .b{color:var(--blue)} #feed .r{color:var(--red)}
#notice{position:fixed;z-index:5;left:0;right:0;top:30%;text-align:center;font-size:30px;font-weight:700;pointer-events:none;text-shadow:0 3px 8px rgba(0,0,0,.8);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.skillBtn{position:fixed;z-index:6;border-radius:50%;border:0;padding:4px;cursor:pointer;touch-action:none;color:var(--text);
  background:conic-gradient(var(--accent-2) calc(var(--p,0)*1%), rgba(232,234,240,.16) 0)}
.skillBtn span{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;background:var(--panel);font-weight:700;font-size:16px;line-height:1.1}
.skillBtn small{font-size:10px;color:var(--text-dim);font-weight:600;margin-top:2px;font-family:'IBM Plex Sans KR',sans-serif}
.skillBtn.ready span{background:var(--accent-2);color:#062824}
.skillBtn.ready small{color:#062824}
#ultBtn{width:84px;height:84px;right:calc(max(16px, env(safe-area-inset-right, 0px)) + 6px);bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
#ultBtn{background:conic-gradient(var(--sel) calc(var(--p,0)*1%), rgba(232,234,240,.16) 0)}
#ultBtn.ready span{background:var(--sel);color:#2a1d00} #ultBtn.ready small{color:#2a1d00}
#dashBtn{width:56px;height:56px;right:calc(max(16px, env(safe-area-inset-right, 0px)) + 20px);bottom:calc(env(safe-area-inset-bottom,0px) + 116px)}
#dashBtn span{font-size:14px}
#sk1Btn,#sk2Btn{width:70px;height:70px}
#sk1Btn{right:calc(max(16px, env(safe-area-inset-right, 0px)) + 98px);bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}
#sk2Btn{right:calc(max(16px, env(safe-area-inset-right, 0px)) + 88px);bottom:calc(env(safe-area-inset-bottom,0px) + 98px)}
.skillBtn b{font-weight:700;font-size:12px;line-height:1.1;max-width:58px;text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-family:'IBM Plex Sans KR',sans-serif;word-break:keep-all}
#weaponLoadout{grid-column:1/-1;text-align:left;display:flex;flex-direction:column;gap:6px;font-family:'IBM Plex Sans KR',sans-serif}
.loHead{font-size:13px;color:var(--sel);font-weight:600;line-height:1.5}
.skRow{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.skRow.on{border-color:var(--accent-2)}
.skText{flex:1;min-width:0}
.skText b{font-size:15px}
.skText i{font-style:normal;font-size:11px;color:var(--text-dim);border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-left:6px}
.skText p{margin:3px 0 0;font-size:12.5px;line-height:1.5;color:#c9ced8}
.skBtns{display:flex;flex-direction:column;gap:4px;flex:none}
.skBtns button{font:600 12px 'IBM Plex Sans KR',sans-serif;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--text-dim);cursor:pointer}
.skBtns button[aria-pressed="true"]{background:var(--accent-2);color:#062824;border-color:var(--accent-2)}
.skBtns button:disabled{opacity:.3;cursor:not-allowed}
#weaponScreen{max-height:calc(100vh - 32px);overflow-y:auto}
#soundBtn{position:fixed;z-index:6;right:max(16px, env(safe-area-inset-right, 0px));top:calc(env(safe-area-inset-top,0px) + 12px);
  background:rgba(20,22,28,.85);color:var(--text-dim);border:1px solid var(--line);border-radius:10px;padding:5px 9px;font:600 12px 'IBM Plex Sans KR',sans-serif;cursor:pointer}

/* ---- UI polish pass ---- */
/* short landscape (phones): title moves to the left column so it never touches the buttons */
@media (max-height:520px){
  #menuScreen.menu-floating{right:max(5vw, calc(env(safe-area-inset-right, 0px) + 24px));left:auto;top:50%;transform:translateY(-50%)}
  .brand{left:max(16px, env(safe-area-inset-left, 0px));top:calc(env(safe-area-inset-top,0px) + 56px);transform:none;width:auto;align-items:flex-start;text-align:left}
  .brand h1{font-size:44px}
  .brand .ver{font-size:12px;margin-top:2px}
}
@media (max-height:360px){
  #menuScreen.menu-floating{width:min(260px,52vw)}
  #menuScreen .menu-float-btn{min-height:38px;margin-bottom:9px;padding:0 16px;font-size:16px}
  #menuScreen .menu-float-btn.go{min-height:44px;font-size:18px}
  .brand h1{font-size:36px}
}
/* touch layout: the attack stick sits in the bottom right corner (drawn on the canvas), the skill buttons fan out around it within thumb reach */
#safeProbe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
body.touchUi{--sr:max(0px, calc(env(safe-area-inset-right, 0px) - 8px));--sb:env(safe-area-inset-bottom,0px)}
body.touchUi #sk1Btn,body.touchUi #sk2Btn{width:66px;height:66px}
body.touchUi #sk1Btn{right:calc(var(--sr) + 186px);bottom:calc(var(--sb) + 46px)}
body.touchUi #dashBtn{width:54px;height:54px;right:calc(var(--sr) + 157px);bottom:calc(var(--sb) + 157px)}
body.touchUi #sk2Btn{right:calc(var(--sr) + 80px);bottom:calc(var(--sb) + 186px)}
body.touchUi #ultBtn{width:76px;height:76px;right:calc(var(--sr) + 195px);bottom:calc(var(--sb) + 195px)}
@media (max-height:360px){
  body.touchUi #ultBtn{width:68px;height:68px;right:calc(var(--sr) + 262px);bottom:calc(var(--sb) + 40px)}      /* very short screens: no room on the diagonal, the ultimate goes left of skill 1 */
}
/* phone held upright: no room beside the stick, so the buttons stack above it */
@media (max-width:520px) and (orientation:portrait){
  body.touchUi #dashBtn{right:calc(var(--sr) + 124px);bottom:calc(var(--sb) + 160px)}
  body.touchUi #sk2Btn{right:calc(var(--sr) + 36px);bottom:calc(var(--sb) + 170px)}
  body.touchUi #sk1Btn{right:calc(var(--sr) + 112px);bottom:calc(var(--sb) + 232px)}
  body.touchUi #ultBtn{right:calc(var(--sr) + 28px);bottom:calc(var(--sb) + 250px)}
}
body.touchUi .skillBtn{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body.touchUi .skillBtn::after{content:'';position:absolute;inset:-7px;border-radius:50%}      /* a little extra room to hit */
body.touchUi #chatFeed{bottom:calc(env(safe-area-inset-bottom,0px) + 170px)}
body.touchUi canvas{touch-action:none}
#overScreen .final.solo span:not(#fb){display:none}
#overScreen .final.solo #fb{color:var(--text)}
/* daily quests: the button under the karma count, and the list of three */
#quest{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 58px);right:max(16px, env(safe-area-inset-right, 0px));display:flex;align-items:center;gap:6px;cursor:pointer;
  background:rgba(20,22,28,.85);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 9px;font:700 15px 'IBM Plex Sans KR',sans-serif;color:var(--text);font-variant-numeric:tabular-nums}
#quest svg{width:20px;height:20px;display:block;color:#7fe0a0}
#quest[hidden]{display:none}
#questDot{position:absolute;top:-3px;right:-3px;width:13px;height:13px;border-radius:50%;background:var(--red);border:2px solid #14161c}
#questScreen{width:min(520px,100%)}
#questList,#achList{display:flex;flex-direction:column;gap:10px;margin-top:12px}
#questList[hidden],#achList[hidden]{display:none}
#achList{gap:7px;max-height:min(460px,calc(100vh - 190px));overflow-y:auto;padding-right:4px;scrollbar-width:thin}
.qTabs{display:flex;gap:6px;margin:0 90px 0 0}
.qTabs button{position:relative;border:0;background:none;color:var(--text-dim);font:700 20px 'IBM Plex Sans KR',sans-serif;padding:4px 8px 6px;border-bottom:3px solid transparent;cursor:pointer}
.qTabs button.on{color:var(--text);border-bottom-color:var(--sel)}
#achDot{position:absolute;top:0;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--red)}
#achDot[hidden]{display:none}
/* achievements: the stripe is the difficulty (basic, normal, hard, extreme) */
.qRow.aRow{padding:8px 12px;border-left:5px solid var(--ac)}
.qRow.aRow .qTxt{display:flex;align-items:baseline;gap:8px;font-size:14px}
.qRow.aRow .qTxt small{margin-left:auto;color:var(--text-dim);font-weight:700;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.qRow.aRow .qBar{height:14px}
.qRow.aRow .qRw{min-width:72px;height:42px}
.a-0{--ac:#7fe0a0}.a-1{--ac:#6fb8ff}.a-2{--ac:#b07cff}.a-3{--ac:#ff4d6d}
@media (max-width:520px){.qTabs{margin-right:0}.qTabs button{font-size:17px}}
@media (max-height:420px){#achList{max-height:calc(100vh - 120px)}.qTabs button{font-size:16px;padding:0 8px 3px}}
.qRow{display:grid;grid-template-columns:1fr auto;grid-template-areas:"t r" "b r";gap:6px 12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line)}
.qRow .qTxt{grid-area:t;font-weight:700;font-size:15px}
.qRow .qBar{grid-area:b;position:relative;height:16px;border-radius:999px;background:#0d0f14;border:1px solid var(--line);overflow:hidden}
.qRow .qBar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#2f9e5a,#7fe0a0);border-radius:999px}
.qRow .qBar span{position:absolute;inset:0;display:grid;place-items:center;font:700 11px 'IBM Plex Sans KR',sans-serif;color:#fff;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.qRow .qRw{grid-area:r;min-width:84px;height:48px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;border:2px solid var(--line);background:#14161c;color:var(--text);font:700 15px 'IBM Plex Sans KR',sans-serif;font-variant-numeric:tabular-nums}
.qRow .qRw .rwI,.qRow .qRw .coin{font-size:22px}
.qRow .qRw svg,.gotLine i svg{width:1.1em;height:1.1em;display:block}
.qRow .qRw svg{font-size:22px}
.qRow .qRw:disabled>*{opacity:.45}
.qRow.done .qRw{border-color:var(--sel);box-shadow:0 0 12px rgba(255,211,77,.45);cursor:pointer}
.qRow.took{opacity:.55}
.qRow.took .qRw::after{content:'';width:14px;height:8px;border-left:3px solid #5fff8a;border-bottom:3px solid #5fff8a;transform:rotate(-45deg) translate(2px,-2px)}
.qRow.took .qRw>*{display:none}
.qRow.took .qRw{font-size:0}
@media (max-width:520px){ #quest{top:calc(env(safe-area-inset-top,0px) + 52px);font-size:14px;padding:4px 10px 4px 8px} }
@media (max-height:420px){ #quest{top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(max(16px, env(safe-area-inset-right, 0px)) + 122px)} #questList{gap:6px;margin-top:6px} .qRow{padding:6px 10px} .qRow .qRw{height:38px} }
/* karma: the trophy-like count, top right of the lobby */
#karma{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 14px);right:max(16px, env(safe-area-inset-right, 0px));display:flex;align-items:center;gap:7px;
  background:rgba(20,22,28,.85);border:1px solid #6b3fc4;border-radius:999px;padding:5px 14px 5px 8px;font:700 17px 'IBM Plex Sans KR',sans-serif;color:#d9b8ff;font-variant-numeric:tabular-nums;box-shadow:0 0 12px rgba(150,80,255,.25)}
#karma svg{width:24px;height:24px;display:block}
#karmaGain{display:inline-flex;align-items:center;gap:4px;color:#d9b8ff;margin-right:12px}
#karmaGain svg{width:18px;height:18px}
#karmaGain[hidden]{display:none}
@media (max-width:520px){
  #acct{max-width:calc(100vw - 132px);gap:6px}
  #acctName{max-width:none;min-width:0;flex:0 1 auto}
  #acct>*:not(#acctName){flex:none}
  #karma{font-size:15px;padding:5px 11px 5px 7px;gap:5px}
  #karma svg{width:20px;height:20px}
}
@media (max-height:520px){
  #overScreen.active{padding:10px 22px}
  #overScreen #resultText{font-size:clamp(38px,7vw,54px);line-height:1.05}
  #overScreen .final{font-size:28px}
  #overScreen{max-height:calc(100vh - 12px);overflow-y:auto}
  #overScreen #winCanvas{width:auto;max-width:100%;height:min(120px,30vh);justify-self:center;margin:0}
  #overScreen .osRow{min-height:24px;margin-bottom:2px;padding-top:1px;padding-bottom:1px}
  #overScreen #mine{display:none}      /* the table on the right already says it; the row goes to karma and gold */
  #overScreen #goldGain{grid-row:3;margin:2px 0 8px;font-size:14px}
  #overScreen #againBtn{margin:0 0 6px}
}
/* karma road: a bar of steps, each with a reward to take once the karma is reached */
#karma{cursor:pointer;position:fixed}
/* the top right corner (the design picked from the mockups): a quest tile, then the karma banner with its bar to the next step of the road */
#topRight{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:row-reverse;align-items:center;gap:8px;pointer-events:none}
#topRight>*{pointer-events:auto}
#topRight[hidden],#streak[hidden]{display:none}
#topRight #karma,#topRight #quest{position:relative;top:auto;right:auto;box-sizing:border-box;height:56px;margin:0;cursor:pointer;font-family:'IBM Plex Sans KR',sans-serif;font-weight:800;font-variant-numeric:tabular-nums;border-radius:14px;border:2px solid;transition:transform .08s ease}
#topRight #karma:active,#topRight #quest:active{transform:translateY(2px)}
#topRight #karma{display:flex;align-items:center;gap:10px;min-width:156px;padding:0 14px 0 10px;color:#e9d8ff;font-size:22px;background:linear-gradient(180deg,#34206a,#1d1338);border-color:#8a5cf0;box-shadow:0 4px 0 #120b26,0 0 14px rgba(150,80,255,.3)}
#topRight #karma svg{width:38px;height:38px;flex:none;filter:drop-shadow(0 0 5px rgba(180,120,255,.6))}
#karma .kCol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:stretch;gap:5px;text-align:left;line-height:1}
#karmaBar{display:block;height:7px;border-radius:999px;background:#0e0920;overflow:hidden}
#karmaBar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#8a5cf0,#e3c4ff)}
#topRight #quest{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:56px;padding:0;color:#bff0cf;font-size:14px;line-height:1;background:linear-gradient(180deg,#17361f,#0f2014);border-color:#45c878;box-shadow:0 4px 0 #08140c}
#topRight #quest svg{width:26px;height:26px;color:#a8f0c0}
#topRight #karmaDot,#topRight #questDot{top:-6px;right:-6px;width:15px;height:15px}
#streak{display:flex;align-items:center;gap:5px;height:34px;padding:0 12px 0 9px;border-radius:999px;background:rgba(20,22,28,.85);border:1px solid #c8602a;color:#ffb070;font:800 17px 'IBM Plex Sans KR',sans-serif;font-variant-numeric:tabular-nums}
@media (max-width:520px){
  #topRight{top:calc(env(safe-area-inset-top,0px) + 60px)}
  #topRight #karma,#topRight #quest{height:48px;border-radius:12px}
  #topRight #karma{min-width:132px;font-size:19px;gap:8px;padding:0 12px 0 8px}
  #topRight #karma svg{width:32px;height:32px}
  #karmaBar{height:6px}
  #topRight #quest{width:48px;font-size:12px}
  #topRight #quest svg{width:22px;height:22px}
  #streak{position:absolute;top:56px;right:0;height:28px;font-size:14px}
  .brand{left:max(16px, env(safe-area-inset-left, 0px));transform:none;width:auto;align-items:flex-start;text-align:left}
  .brand h1{font-size:min(38px, calc((100vw - 236px) / 6))}
  .brand .ver{max-width:calc(100vw - 236px);text-align:left}
}
@media (max-height:560px){
  #topRight{top:calc(env(safe-area-inset-top,0px) + 5px)}
  #topRight #karma,#topRight #quest{height:44px;border-radius:12px;box-shadow:0 3px 0 #120b26}
  #topRight #karma{min-width:128px;font-size:18px;gap:8px;padding:0 12px 0 8px}
  #topRight #karma svg{width:30px;height:30px}
  #karmaBar{height:5px}
  #topRight #quest{width:46px;font-size:12px}
  #topRight #quest svg{width:21px;height:21px}
  #streak{height:30px;font-size:15px}
}
#karmaDot{position:absolute;top:-3px;right:-3px;width:13px;height:13px;border-radius:50%;background:var(--red);border:2px solid #14161c}
#karmaScreen{width:min(760px,100%)}
#karmaScreen h2{display:flex;align-items:center;gap:8px}
#karmaScreen h2 .kmI{width:26px;height:26px}
#karmaScreen h2 b{color:#d9b8ff;font-variant-numeric:tabular-nums}
#karmaRoad{overflow-x:auto;overflow-y:hidden;margin:14px -6px 4px;padding:6px 6px 12px;scrollbar-width:thin;touch-action:pan-x;-webkit-overflow-scrolling:touch}
#karmaTrack{position:relative;display:flex;gap:14px;width:max-content;padding:0 8px}
#karmaTrack::before,#karmaFill{content:'';position:absolute;left:0;top:104px;height:10px;border-radius:999px}
#karmaTrack::before{right:0;background:#0d0f14;border:1px solid var(--line)}
#karmaFill{background:linear-gradient(90deg,#5a1fb8,#a45cff,#e3c4ff);box-shadow:0 0 10px rgba(164,92,255,.6)}
.kStep{position:relative;z-index:1;flex:none;width:92px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0;border:0;background:none;color:var(--text);font:700 13px 'IBM Plex Sans KR',sans-serif;cursor:default}
.kStep .kBox{width:92px;height:88px;border-radius:12px;border:2px solid var(--line);background:var(--panel-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-variant-numeric:tabular-nums}
.kStep .kBox .coin{font-size:26px}
.kStep .kBox svg{width:30px;height:30px;color:var(--sel)}
.kStep .kPin{width:18px;height:18px;border-radius:50%;background:#0d0f14;border:2px solid var(--line);margin-top:4px}
.kStep .kNum{color:var(--text-dim);font-variant-numeric:tabular-nums}
.kStep.lock .kBox>*{opacity:.4}
.kStep.reach .kPin,.kStep.done .kPin{background:#a45cff;border-color:#e3c4ff}
.kStep.reach{cursor:pointer}
.kStep.reach .kBox{border-color:var(--sel);box-shadow:0 0 14px rgba(255,211,77,.5);animation:kPulse 1.1s ease-in-out infinite alternate}
.kStep.done .kBox{border-color:#3d8f6b;background:#16241f}
.kStep.done .kBox>*{opacity:.45}
.kStep.done .kBox::after{content:'✓';position:absolute;top:26px;font-size:30px;color:#5fff8a;font-weight:800}
@keyframes kPulse{to{transform:translateY(-3px)}}
@media (prefers-reduced-motion: reduce){.kStep.reach .kBox{animation:none}}
.gotLine{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px;font:700 15px 'IBM Plex Sans KR',sans-serif;color:var(--sel)}
.gotLine canvas{width:64px;height:64px}
@media (max-height:420px){
  .kStep .kBox{height:66px}
  .kStep .kBox .coin{font-size:20px}
  .kStep .kBox svg{width:22px;height:22px}
  #karmaTrack::before,#karmaFill{top:82px}
  .kStep.done .kBox::after{top:16px}
  #karmaRoad{margin-top:6px}
  .gotLine canvas{width:44px;height:44px}
}

.kStep .kBox .rwI{font-size:30px}
.kStep.k-ebox .kBox{background:linear-gradient(160deg,#2a1a4a,#1a1d26)} .kStep.k-skin .kBox{background:linear-gradient(160deg,#4a3a12,#1a1d26)}
.gotLine .rwI,.gotLine .coin{font-size:34px}
.gotLine [hidden]{display:none}
/* player level: the number in the account pill, the ring around it is the way to the next level */
#acct #acctIcon{display:grid;place-items:center;flex:none;width:24px;height:24px;border-radius:50%;font:800 12px 'IBM Plex Sans KR',sans-serif;color:#fff;background:radial-gradient(#14161c 58%,transparent 60%),conic-gradient(#4aa6ff calc(var(--p,0)*1%),#2a3142 0)}
/* character mastery */
#lobbyCharName{white-space:nowrap}
#lobbyCharName small{font-size:13px;font-weight:700;letter-spacing:.02em;margin-left:7px;vertical-align:2px}
.mRow{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:13px}
.mRow b{color:var(--mc);white-space:nowrap}
.mRow .mBar{flex:1;min-width:40px;height:8px;border-radius:999px;background:#0d0f14;border:1px solid var(--line);overflow:hidden}
.mRow .mBar i{display:block;height:100%;background:var(--mc);border-radius:999px}
.mRow small{color:var(--text-dim);font-variant-numeric:tabular-nums;white-space:nowrap}
#goldGain{flex-wrap:wrap;gap:4px 12px}
#goldGain>span{display:inline-flex;align-items:center;gap:4px}
#goldGain #karmaGain{margin-right:0}
#xpGain{color:#8cc4ff}
/* gold and the skin shop */
.coin{display:inline-block;flex:none;width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0 0 18%,#ffd34d 38%,#d99a1c 100%);box-shadow:inset 0 0 0 .1em #a86e0c;vertical-align:-.14em}
.goldPill{display:inline-flex;align-items:center;gap:5px;font:700 14px 'IBM Plex Sans KR',sans-serif;color:var(--sel);font-variant-numeric:tabular-nums;white-space:nowrap}
#cosScreen h2 .goldPill{margin-left:10px;padding:3px 10px 3px 7px;border-radius:999px;background:#0d0f14;border:1px solid var(--line);vertical-align:3px}
.cosGrp{grid-column:1/-1;margin:8px 0 0;font:400 16px 'Black Han Sans','IBM Plex Sans KR',sans-serif;letter-spacing:.04em;color:var(--text);text-align:left}
.cosGrp:first-child{margin-top:0}
.cosCard.lock .cosPv{opacity:.72}
.cosPrice{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--sel);font-variant-numeric:tabular-nums;white-space:nowrap}
.cosPrice.poor{color:#ff8d8d}
.cosCard.buy{border-color:var(--accent-2);box-shadow:0 0 10px rgba(61,219,180,.4)}
.cosCard.buy .cosPrice{color:#062824;background:var(--accent-2);border-radius:999px;padding:1px 8px}
.cosCard.no{animation:cosNo .3s}
.cosCard .cosOff{order:1;font-size:11px;font-weight:700;color:#14161c;background:var(--sel);border-radius:999px;padding:2px 9px;white-space:nowrap}
.cosCard:has(.cosOff)>span:not(.cosOff){order:2}
@keyframes cosNo{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion: reduce){.cosCard.no{animation:none}}
#goldGain{margin:-4px 0 8px;font:700 16px 'IBM Plex Sans KR',sans-serif;color:var(--sel);display:flex;justify-content:center;align-items:center;gap:5px}
/* game modes: lobby card, picker window, waiting room badge */
.mIco{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:8px;border:1.5px solid var(--mc,#fff);color:var(--mc,#fff);background:color-mix(in srgb,var(--mc,#fff) 16%,#14171f)}
.mIco svg{width:20px;height:20px;display:block}
#menuScreen #modeChip{justify-content:flex-start;gap:12px;text-align:left;padding:0 14px 0 22px}
#modeChip .mTxt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
#modeChip .mTxt b{font-weight:400;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#modeChip .mTxt small{font:600 12px 'IBM Plex Sans KR',sans-serif;letter-spacing:0;color:#c9ced8;text-shadow:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#modeChip .mArr{flex:none;font:400 26px/1 'IBM Plex Sans KR',sans-serif;margin-top:-3px}
/* mode picker: a full screen over the lobby. .pc = a row of tall event cards (the button below confirms), .ph = big posters (touch or small screens, a tap picks) */
#modeScreen.active{display:flex;flex-direction:column;align-self:stretch;width:100%;max-width:none;min-height:100%;margin:0;padding:0;background:none;border:0;border-radius:0;box-shadow:none}
#modeScreen .msHead{flex:none;display:flex;align-items:center;gap:14px;padding:2px 4px 0}
#modeScreen .msHead h2{margin:0;font:400 28px 'Black Han Sans','IBM Plex Sans KR',sans-serif;letter-spacing:.04em;text-shadow:0 3px 0 rgba(0,0,0,.45);transform:skewX(-8deg)}

/* PC: the cards stand in one row, the one being looked at steps up */
#modeScreen.pc #modeGrid{display:flex;justify-content:center;align-items:center;gap:clamp(12px,1.6vw,22px);padding:22px 0 24px}
#modeScreen.pc .modeCard{flex:0 1 250px;height:clamp(320px,62vh,430px);clip-path:polygon(20px 0,100% 0,calc(100% - 20px) 100%,0 100%);transition:transform .14s ease,filter .14s ease}
#modeScreen.pc .mIn{clip-path:polygon(19px 0,100% 0,calc(100% - 19px) 100%,0 100%);grid-template:58px minmax(0,1fr) auto auto / minmax(0,1fr);background:linear-gradient(180deg,#151922 50%,color-mix(in srgb,var(--c) 10%,#151922) 62%,#121620)}
#modeScreen.pc .mTop{grid-area:1/1;gap:10px;padding:0 16px 0 26px;background:linear-gradient(100deg,var(--c),var(--d))}
#modeScreen.pc .mTop .mIco{width:36px;height:36px;background:rgba(0,0,0,.25)}
#modeScreen.pc canvas.mArt{grid-area:2/1}
#modeScreen.pc .mSz{grid-area:2/1;align-self:end;z-index:1;padding:0 0 10px 22px}
#modeScreen.pc .mRules{grid-area:3/1;padding:14px 20px 0}
#modeScreen.pc .mMap{grid-area:4/1;padding:14px 22px 16px 18px}
#modeScreen.pc .mTint,#modeScreen.pc .mMark{display:none}
#modeScreen.pc .mTick{top:68px;right:24px}
#modeScreen.pc .modeCard:not(:disabled):hover{transform:translateY(-6px)}
#modeScreen.pc .modeCard[aria-pressed="true"]{transform:translateY(-14px) scale(1.04)}
/* phones: big posters, all four on one screen without scrolling sideways */
#modeScreen.ph #modeGrid{display:grid;grid-template-columns:minmax(0,1fr);grid-auto-rows:minmax(92px,180px);align-content:center;gap:10px;width:100%;max-width:560px;margin:0 auto;padding:14px 0 4px}
/* phone on its side: three cards over two (five modes), the lower two centred; with four or fewer it stays two by two */
@media (orientation:landscape){#modeScreen.ph #modeGrid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(100px,210px);max-width:960px;padding-top:8px}
  #modeScreen.ph #modeGrid.n5{grid-template-columns:repeat(6,minmax(0,1fr))}
  #modeScreen.ph #modeGrid.n5 .modeCard{grid-column:span 2}
  #modeScreen.ph #modeGrid.n5 .modeCard:nth-child(4){grid-column:2 / span 2}}
#modeScreen.ph .modeCard{clip-path:polygon(0 0,calc(100% - 24px) 0,100% 24px,100% 100%,24px 100%,0 calc(100% - 24px))}
#modeScreen.ph .mIn{clip-path:polygon(0 0,calc(100% - 23px) 0,100% 23px,100% 100%,23px 100%,0 calc(100% - 23px));grid-template-rows:auto auto auto 1fr;align-content:start;justify-items:start;row-gap:7px;padding:14px 16px}
#modeScreen.ph canvas.mArt,#modeScreen.ph .mTint,#modeScreen.ph .mMark{position:absolute}
#modeScreen.ph canvas.mArt,#modeScreen.ph .mTint{inset:0}
#modeScreen.ph .mTint{background:linear-gradient(100deg,var(--d) 0%,color-mix(in srgb,var(--d) 85%,transparent) 30%,transparent 62%)}
#modeScreen.ph .mMark{left:-16px;bottom:-26px;width:150px;height:150px;color:var(--c);opacity:.18;transform:rotate(-12deg)}
#modeScreen.ph .mTop,#modeScreen.ph .mSz,#modeScreen.ph .mRules{position:relative;z-index:1}
#modeScreen.ph .mTop{gap:9px;max-width:100%}
#modeScreen.ph .mN{font-size:26px;text-shadow:0 3px 0 rgba(0,0,0,.45)}
#modeScreen.ph .mTop .mIco{width:34px;height:34px}
#modeScreen.ph .mSz{gap:12px}
#modeScreen.ph .mSize{font-size:24px}
#modeScreen.ph .mRule{font-size:11.5px;padding:2px 8px 2px 6px}
#modeScreen.ph .mRule svg{width:13px;height:13px}
#modeScreen.ph .mMap{position:absolute;right:12px;bottom:10px;z-index:1;max-width:46%;background:rgba(8,10,15,.7);border-radius:8px;padding:4px 10px 4px 4px;font-size:11.5px}
#modeScreen.ph .mMap canvas{width:34px;height:22px}
#modeScreen.ph .mTick{top:12px;right:32px}
@media (max-width:360px){#modeScreen.ph .mMap span{display:none}#modeScreen.ph .mMap{padding:4px}#modeScreen.ph .mPips i{width:7px;height:7px}#modeScreen.ph .mSz{gap:8px}}
@media (max-height:420px){#modeScreen .msHead h2{font-size:22px}.msBack{width:48px;height:36px;font-size:28px}#modeScreen.ph .mN{font-size:22px}#modeScreen.ph .mIn{padding:10px 14px;row-gap:5px}}
@media (prefers-reduced-motion: reduce){#modeScreen.pc .modeCard,.msBack{transition:none}}
#roomMode{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px;font:400 17px 'Black Han Sans','IBM Plex Sans KR',sans-serif;letter-spacing:.04em}
#roomMode .mIco{width:26px;height:26px;border-radius:6px}
#roomMode .mIco svg{width:16px;height:16px}
#roomMode:empty{display:none}
@media (max-height:520px){
  #menuScreen .menu-float-btn{min-height:42px;margin-bottom:9px;font-size:18px}

  #modeChip .mIco{width:28px;height:28px}
  #modeChip .mTxt b{font-size:16px}
  #modeChip .mTxt small{font-size:11px}
  #lobbyPick{margin:0;font-size:13px}
}
@media (max-height:360px){
  #menuScreen .menu-float-btn{min-height:34px;margin-bottom:7px;font-size:15px}
  #menuScreen .menu-float-btn.go{min-height:38px;font-size:17px}
  #modeChip .mIco{width:24px;height:24px}
  #modeChip .mIco svg{width:15px;height:15px}
  #modeChip .mTxt b{font-size:14px}

}
/* narrow screens: back link goes above the title instead of on top of it */
@media (max-width:520px){
  .backlink{position:static;display:block;margin:-10px -6px 4px auto}
}
/* character screen: confirm / back-to-list stay reachable while scrolling the skills */
#weaponActions{flex-direction:row;position:sticky;bottom:-14px;z-index:2;margin:6px -14px -14px;padding:10px 14px 14px;background:linear-gradient(to bottom,rgba(26,29,38,0),var(--panel-2) 22%)}
#weaponActions .btn-full{flex:1;width:auto;min-width:0;white-space:nowrap;font-size:12.5px;letter-spacing:0;padding-left:16px;padding-right:16px}

/* match making: no empty gap, a spinner while there is nothing else to show */
#roomCount:empty,#roomSlots:empty{display:none}
#roomStatus{min-height:0}
#roomSpin{display:none;width:34px;height:34px;margin:18px auto 22px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent-2);animation:roomSpin 1s linear infinite}
#roomCount:empty + #roomSlots:empty + #roomSpin{display:block}
@keyframes roomSpin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){#roomSpin{animation-duration:3s}}
/* touch devices: the chat bar sits under the score bar so it never covers the skill buttons or the soft keyboard */
@media (pointer:coarse){
  #chatBar{top:calc(env(safe-area-inset-top,0px) + 70px);bottom:auto;left:max(16px, env(safe-area-inset-left, 0px));right:calc(max(16px, env(safe-area-inset-right, 0px)) + 52px);transform:none;width:auto}
}
/* result screen on wide or short landscape screens: two columns (result + buttons | pose + table) */
@media (min-width:700px),(max-height:520px){
  #overScreen.active{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:0 20px;align-items:center;width:min(820px,100%);padding:16px 22px}
  #overScreen #resultText{grid-column:1;grid-row:1;font-size:clamp(48px,9vw,72px);margin:0}
  #overScreen .final{grid-column:1;grid-row:2;font-size:34px}
  #overScreen #mine{grid-column:1;grid-row:3;margin:2px 0 10px;font-size:13px}
  #overScreen #winCanvas{grid-column:2;grid-row:1 / span 2;width:100%;height:auto}
  #overScreen #overStats{grid-column:2;grid-row:3 / span 4;margin:0;align-self:start}
  #overScreen #goldGain{grid-column:1;grid-row:4;margin:0 0 10px}
  #overScreen #againBtn{grid-column:1;grid-row:5;margin:0 0 8px}
  #overScreen #lobbyBtn{grid-column:1;grid-row:6}
}

/* settings */
#setLobbyBtn{border:0;border-radius:50%;width:26px;height:26px;padding:0;background:var(--panel-2);color:var(--text);font-size:15px;line-height:1;cursor:pointer}
#setLobbyBtn:hover{background:var(--line)}
#setBtn{top:calc(env(safe-area-inset-top,0px) + 142px)}
#settings{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(6,8,12,.62);
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px, env(safe-area-inset-left, 0px));overflow-y:auto}
#settings[hidden]{display:none}
.setCard{width:min(400px,100%);margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.setCard h2{margin:0 0 10px;font-size:22px}
.setRow{display:grid;grid-template-columns:92px minmax(0,1fr) 52px;align-items:center;gap:10px;min-height:50px;font:600 15px 'IBM Plex Sans KR',sans-serif}
.setRow[hidden]{display:none}
.setRow output{text-align:right;color:var(--sel);font-variant-numeric:tabular-nums;font-weight:700}
.setRow input[type=range]{width:100%;height:36px;margin:0;accent-color:var(--accent-2);touch-action:pan-y}
.setSwitch{appearance:none;-webkit-appearance:none;grid-column:3;justify-self:end;width:52px;height:30px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);position:relative;cursor:pointer;margin:0;transition:background .15s}
.setSwitch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#cfd3dc;transition:transform .15s}
.setSwitch:checked{background:var(--accent-2);border-color:var(--accent-2)}
.setSwitch:checked::after{transform:translateX(22px);background:#062824}
.setBtns{display:flex;gap:8px;margin-top:12px}
.setBtns button{flex:1;min-height:44px}
.setBtns #setClose{flex:1.6}
/* result screen: per-fighter table */
#overStats{margin:2px 0 12px;font-family:'IBM Plex Sans KR',sans-serif;font-size:13px;text-align:left}
#overStats:empty{display:none}
.osHead,.osRow{display:grid;grid-template-columns:minmax(0,1fr) 52px 108px;align-items:center;gap:8px;padding:3px 8px}
.osHead{color:var(--text-dim);font-size:11px;letter-spacing:.04em}
.osHead span:nth-child(2),.osRow .ok{text-align:center}
.osRow{border-left:3px solid var(--line);background:var(--panel-2);border-radius:6px;margin-bottom:3px;min-height:28px}
.osRow.b{border-left-color:var(--blue)} .osRow.r{border-left-color:var(--red)}
.osRow.me{box-shadow:inset 0 0 0 1px var(--sel)}
.osRow .on{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.osRow .on small{color:var(--text-dim);font-weight:500;margin-left:5px}
.osRow .mvp{display:inline-block;font-size:10px;font-weight:800;color:#2a1d00;background:var(--sel);border-radius:999px;padding:0 6px;margin-right:5px;vertical-align:1px}
.osRow .ok{font-variant-numeric:tabular-nums}
.osRow .rk{display:inline-block;min-width:16px;margin-right:6px;color:var(--text-dim);font-variant-numeric:tabular-nums;text-align:center}
.osRow .od{position:relative;height:18px;border-radius:5px;background:rgba(232,234,240,.08);overflow:hidden}
.osRow .od i{position:absolute;left:0;top:0;bottom:0;background:rgba(232,234,240,.2)}
.osRow.b .od i{background:rgba(87,163,255,.45)} .osRow.r .od i{background:rgba(255,93,93,.45)}
.osRow .od em{position:absolute;right:6px;top:0;line-height:18px;font-style:normal;font-variant-numeric:tabular-nums;font-size:12px}
#overStats.noDmg .osHead,#overStats.noDmg .osRow{grid-template-columns:minmax(0,1fr) 52px}
#overStats.noDmg .od,#overStats.noDmg .osHead span:nth-child(3){display:none}
.osGap{height:6px}
/* who got you */
#notice .kb{display:block;margin-top:6px;font-size:16px;font-weight:600;font-family:'IBM Plex Sans KR',sans-serif}
#notice .kb b.b{color:var(--blue)} #notice .kb b.r{color:var(--red)}
#notice .kb small{color:var(--text-dim);font-size:14px;font-weight:500}

/* shared button style (same family as the lobby menu): slanted plate, blue edge on the left and red on the right; primary = blue-violet-red */
.btn-primary,.btn-plain{border:0;border-radius:0;font-family:'Black Han Sans','IBM Plex Sans KR',sans-serif;font-weight:400;letter-spacing:.05em;color:#fff;

.btn-primary:hover:not(:disabled),.btn-plain:hover{filter:brightness(1.18)}
.btn-primary:active:not(:disabled),.btn-plain:active{transform:scale(.98)}
.btn-primary:focus-visible,.btn-plain:focus-visible{outline:2px solid #fff;outline-offset:-4px}
@media (prefers-reduced-motion: reduce){.btn-primary,.btn-plain{transition:none}}

<button id="sk2Btn" class="skillBtn" type="button" hidden aria-label="2스킬"><span><b id="sk2Name"></b><small id="sk2Hint">E</small></span></button>

<div id="emoteWheel" hidden></div>
<div id="settings" hidden>
  <div class="setCard" role="dialog" aria-modal="true" aria-labelledby="setTitle">

    <label class="setRow"><span>음량</span><input id="setVol" type="range" min="0" max="100" step="5"><output id="setVolV"></output></label>
    <label class="setRow" id="setAimRow"><span>조준 감도</span><input id="setAim" type="range" min="50" max="200" step="10"><output id="setAimV"></output></label>

  </div>
</div>
<div id="diceBannerContainer"></div>

<div id="lobby">

  <div id="topRight">
  <button id="karma" type="button" aria-label="카르마"><svg aria-hidden="true"><use href="#mi-karma"/></svg><span class="kCol"><b class="karmaN">0</b><span id="karmaBar"><i></i></span></span><i id="karmaDot" hidden></i></button>

  <div id="lobbyChar" class="show"><canvas id="lobbyCharCanvas" width="360" height="414"></canvas><div id="lobbyCharName"></div></div>

  <div class="card menu-floating active" id="menuScreen">
    <button class="menu-float-btn" id="modeChip" type="button"><span class="mIco" id="modeChipIco"></span><span class="mTxt"><b id="modeChipName"></b><small id="modeChipMeta"></small></span><span class="mArr" aria-hidden="true">&rsaquo;</span></button>
    <button class="menu-float-btn go" id="startBtn" type="button"><svg class="mi" aria-hidden="true"><use href="#mi-play"/></svg><span>게임 시작</span></button>

    <p class="hint" id="cosHint"></p>
    <div id="cosGrid"></div>

  <div class="card" id="karmaScreen">

    <div class="qTabs"><button id="qTabD" type="button" class="on">일일 과제</button><button id="qTabA" type="button">도전과제<i id="achDot" hidden></i></button></div>
    <div id="questList"></div>
    <div id="achList" hidden></div>
    <div id="questGot" class="gotLine" hidden><canvas width="96" height="96"></canvas><i></i><b></b></div>
  </div>

  <div class="card" id="modeScreen">
    <div class="msHead"><button class="msBack" id="modeBackBtn" type="button" aria-label="뒤로가기"><span aria-hidden="true">&lsaquo;</span></button><h2>모드 선택</h2></div>
    <div id="modeGrid"></div>
    <div class="msFoot"><button class="btn-primary" id="modePickBtn" type="button">이 모드로 하기</button></div>

  <div class="card" id="mapScreen">

      <button id="mapPrevBtn" type="button" aria-label="이전 맵">&lsaquo;</button>

        <canvas id="mapCarouselPreview" width="500" height="340"></canvas>

        <div id="mapCarouselMeta"></div>
      </div>
      <button id="mapNextBtn" type="button" aria-label="다음 맵">&rsaquo;</button>
    </div>
    <div id="mapDots"></div>
    <button class="btn-primary btn-full" id="mapPickBtn" type="button">이 맵으로 하기</button>
  </div>

  <div class="card" id="weaponScreen">
    <button class="backlink" id="weaponBrowseBackBtn" type="button">&larr; 뒤로가기</button>

    <input id="weaponSearch" type="search" placeholder="캐릭터 검색" autocomplete="off">

    </div>
  </div>

  <div class="card" id="overScreen">
    <p id="resultText">승리</p>

    <div id="overStats"></div>
    <button class="btn-primary btn-full" id="againBtn" type="button">다시 하기</button>
    <button class="btn-plain btn-full" id="lobbyBtn" type="button">로비로</button>
  </div>
</div>
